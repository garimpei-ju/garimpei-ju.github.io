<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garimpei Ju | Achadinhos</title>
<meta name="description" content="Eu garimpo, você economiza! 🧡 Todos os achadinhos da Garimpei Ju com link direto.">
<meta name="theme-color" content="#F25C2A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --laranja:#F25C2A; --laranja-esc:#D9481A; --pessego:#FFE9DF; --creme:#FFF8F3;
    --texto:#2B1D16; --suave:#7A6559; --borda:#F1DDD2; --card:#FFFFFF;
    --shopee:#EE4D2D; --ml:#2D3277; --ml-bg:#FFE600;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--creme);color:var(--texto);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}

  header{text-align:center;padding:36px 8px 20px}
  .logo{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
        background:linear-gradient(135deg,#FF8A4C,var(--laranja));font-size:38px;box-shadow:0 8px 22px rgba(242,92,42,.28)}
  .foto{width:92px;height:92px;border-radius:50%;margin:0 auto 12px;display:block;object-fit:cover;
        border:4px solid #fff;box-shadow:0 0 0 3px var(--laranja),0 8px 22px rgba(242,92,42,.25)}
  h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
  .frase{color:var(--suave);font-weight:700;margin-top:4px}
  .insta{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 14px;border-radius:999px;
         background:var(--card);border:1px solid var(--borda);color:var(--texto);text-decoration:none;font-weight:800;font-size:14px}
  .insta:active{transform:scale(.97)}

  .dica{background:var(--pessego);border-radius:16px;padding:12px 14px;font-size:14px;font-weight:700;color:#8A3A1A;text-align:center;margin-bottom:14px}

  .busca{position:sticky;top:0;z-index:5;background:var(--creme);padding:10px 0 8px}
  .campo{position:relative}
  .campo input{width:100%;font:inherit;font-size:16px;font-weight:700;padding:14px 16px 14px 46px;border-radius:16px;
               border:2px solid var(--borda);background:var(--card);color:var(--texto);outline:none}
  .campo input:focus{border-color:var(--laranja)}
  .campo svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--suave)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font:inherit;font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;
        border:1.5px solid var(--borda);background:var(--card);color:var(--texto)}
  .chip[aria-pressed="true"]{background:var(--laranja);border-color:var(--laranja);color:#fff}

  .contagem{font-size:13px;color:var(--suave);font-weight:700;margin:6px 2px 10px}
  .lista{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--borda);border-radius:18px;
        padding:10px;text-decoration:none;color:inherit;box-shadow:0 2px 8px rgba(43,29,22,.04);transition:transform .12s}
  .item:active{transform:scale(.985)}
  .thumb{position:relative;flex:0 0 72px;height:72px;border-radius:12px;overflow:hidden;background:var(--pessego)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .num{position:absolute;left:4px;top:4px;background:var(--texto);color:#fff;font-weight:900;font-size:12px;padding:2px 7px;border-radius:8px}
  .info{flex:1;min-width:0}
  .nome{font-weight:800;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#F6EEE9;color:var(--suave)}
  .tag.shopee{background:#FDE7E2;color:var(--shopee)}
  .tag.ml{background:var(--ml-bg);color:var(--ml)}
  .ir{flex:0 0 auto;background:var(--laranja);color:#fff;font-weight:900;font-size:13px;padding:10px 12px;border-radius:12px}

  .vazio{text-align:center;color:var(--suave);font-weight:700;padding:40px 10px}
  footer{margin-top:28px;text-align:center;font-size:12px;color:var(--suave);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🛍️</div>
    <h1>Garimpei Ju</h1>
    <p class="frase">Eu garimpo, você economiza! 🧡</p>
    <a class="insta" href="https://instagram.com/garimpei_ju" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>
      @garimpei_ju
    </a>
  </header>

  <p class="dica">Viu um achadinho? Digita o <b>número</b> aqui embaixo 👇</p>

  <div class="busca">
    <div class="campo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" placeholder="Número ou nome do achadinho" autocomplete="off" aria-label="Buscar achadinho">
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Categorias"></div>
  </div>

  <p class="contagem" id="contagem"></p>
  <div class="lista" id="lista"></div>

  <footer>
    Preços e estoque podem mudar a qualquer momento: confira na loja.<br>
    Alguns links são de afiliada: posso ganhar uma comissão, sem custo a mais pra você. 🧡
  </footer>
</div>

<script>
const DADOS = {"itens": [{"num": 1, "nome": "Torneira flexível 360° com chuveirinho", "categoria": "Utensílios", "loja": "Shopee", "link": "https://s.shopee.com.br/7VI4aEqaFz", "imagem": "https://down-br.img.susercontent.com/file/sg-11134201-8258e-mt4uwt4gdh4x78", "adicionado": "2026-11-18"}], "categorias": ["Utensílios"]};
const lista = document.getElementById('lista');
const chips = document.getElementById('chips');
const q = document.getElementById('q');
const contagem = document.getElementById('contagem');
let cat = 'Todos';

const sem = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

['Todos', ...DADOS.categorias].forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = c; b.type = 'button';
  b.setAttribute('aria-pressed', c === cat);
  b.onclick = () => { cat = c; chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
  chips.appendChild(b);
});

function render(){
  const termo = sem(q.value.trim().replace(/^#/, ''));
  const ehNumero = /^\d+$/.test(termo);
  const itens = DADOS.itens.filter(a => {
    if (cat !== 'Todos' && a.categoria !== cat) return false;
    if (!termo) return true;
    if (ehNumero) return String(a.num) === termo;
    return sem(a.nome + ' ' + a.categoria + ' ' + a.loja).includes(termo);
  });
  contagem.textContent = itens.length === 1 ? '1 achadinho' : itens.length + ' achadinhos';
  if (!itens.length){
    lista.innerHTML = '<p class="vazio">Não achei esse achadinho 😕<br>Confere o número ou tenta outra palavra.</p>';
    return;
  }
  lista.innerHTML = itens.map(a => {
    const lojaCls = a.loja === 'Shopee' ? 'shopee' : (a.loja === 'Mercado Livre' ? 'ml' : '');
    return `<a class="item" href="${esc(a.link)}" target="_blank" rel="noopener sponsored">
      <div class="thumb"><img src="${esc(a.imagem)}" alt="" loading="lazy" onerror="this.remove()"><span class="num">#${a.num}</span></div>
      <div class="info">
        <div class="nome">${esc(a.nome)}</div>
        <div class="meta"><span class="tag ${lojaCls}">${esc(a.loja)}</span><span class="tag">${esc(a.categoria)}</span></div>
      </div>
      <span class="ir">Ver</span>
    </a>`;
  }).join('');
}
q.addEventListener('input', render);
render();
</script>
</body>
</html>
