<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Surpresa">
<meta name="theme-color" content="#140a24">
<title>Surpresa do Amor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Montserrat:wght@500;700&display=swap">
<style>
/* Layout: uma tela cheia, estilo pôr do sol retrô dos anos 80, com cenas que trocam em sequência */
:root{
  --noite:#140a24; --roxo:#3b1257; --rosa:#ff3d8b; --laranja:#ff9a3c; --sol:#ffd34d; --ciano:#3ee6ff; --branco:#fff6ee;
  --f-grande:"Anton","Impact","Arial Black",sans-serif;
  --f-script:"Yellowtail","Brush Script MT",cursive;
  --f-texto:"Montserrat","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--noite);color:var(--branco);font-family:var(--f-texto);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ceu{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.cena{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh;
  padding:4vh max(16px,env(safe-area-inset-right,0px)) 4vh max(16px,env(safe-area-inset-left,0px));transition:opacity .8s ease}
.cena.fora{opacity:0;pointer-events:none}
.script{font-family:var(--f-script);color:var(--sol);font-size:clamp(34px,7vw,120px);line-height:1;text-shadow:0 0 18px rgba(255,61,139,.8),3px 3px 0 var(--rosa);transform:rotate(-6deg)}
.grande{font-family:var(--f-grande);text-transform:uppercase;letter-spacing:.02em;line-height:.95;font-size:clamp(48px,13vw,230px);
  background:linear-gradient(180deg,var(--sol) 0%,var(--laranja) 45%,var(--rosa) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(5px 5px 0 var(--roxo)) drop-shadow(0 0 22px rgba(255,61,139,.55));text-wrap:balance}
.media{font-family:var(--f-grande);text-transform:uppercase;font-size:clamp(26px,5vw,80px);color:var(--ciano);letter-spacing:.04em;text-shadow:0 0 16px rgba(62,230,255,.7)}
.pequeno{font-size:clamp(15px,2vw,30px);font-weight:500;max-width:32ch;color:var(--branco);opacity:.92}
#num{font-family:var(--f-grande);font-size:clamp(140px,38vw,560px);line-height:1;color:var(--branco);text-shadow:0 0 30px var(--rosa),0 0 80px var(--rosa)}
.pulsa{animation:pulsa .9s ease-out}
@keyframes pulsa{0%{transform:scale(1.6);opacity:0}40%{opacity:1}100%{transform:scale(1);opacity:1}}
.entra{animation:entra 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes entra{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
button{font-family:var(--f-grande);text-transform:uppercase;letter-spacing:.06em;font-size:clamp(20px,3vw,44px);color:var(--noite);
  background:linear-gradient(90deg,var(--sol),var(--laranja),var(--rosa));border:0;border-radius:999px;padding:.55em 1.6em;cursor:pointer;
  box-shadow:0 0 0 4px rgba(255,246,238,.15),0 0 40px rgba(255,61,139,.6)}
button:focus-visible{outline:4px solid var(--ciano);outline-offset:6px}
.dica{font-size:clamp(12px,1.4vw,18px);opacity:.6}
#confete{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#denovo{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;font-size:14px;padding:.5em 1em;opacity:.5;box-shadow:none}
@media (prefers-reduced-motion:reduce){.pulsa,.entra{animation:none}}
</style>
</head>
<body>

<canvas id="ceu" aria-hidden="true"></canvas>
<canvas id="confete" aria-hidden="true"></canvas>

<section class="cena" id="c0">
  <div class="script">Ei, amor...</div>
  <div class="media">Tenho uma coisa pra você</div>
  <button id="comecar">Aperta aqui</button>
  <div class="dica">Aumenta o som da TV 🔊</div>
</section>

<section class="cena fora" id="c1">
  <div class="script">Hoje é</div>
  <div class="grande">Dia do Homem</div>
  <div class="pequeno">E o meu homem merece um presente à altura...</div>
</section>

<section class="cena fora" id="c2" aria-live="polite">
  <div class="media">Prepara o controle</div>
  <div id="num">3</div>
</section>

<section class="cena fora" id="c3">
  <div class="script">Surpresa!</div>
  <div class="grande entra" id="gta">GTA VI<br>é seu!</div>
  <div class="media">Já tá no PS5 te esperando 🎮</div>
  <div class="pequeno">Feliz Dia do Homem, amor! Bom jogo, e não esquece de mim quando chegar em Vice City 🧡</div>
</section>

<button id="denovo" hidden>Ver de novo</button>

<script>
(function(){
  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* ---------- céu: pôr do sol, grade neon e palmeiras ---------- */
  const ceu = document.getElementById('ceu'), cx = ceu.getContext('2d');
  let W=0,H=0,t=0,estrelas=[];
  function tam(){
    const d=Math.min(devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    [ceu,conf].forEach(c=>{c.width=W*d;c.height=H*d;c.getContext('2d').setTransform(d,0,0,d,0,0)});
    estrelas=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*H*.5,r:Math.random()*1.4+.3,f:Math.random()*6}));
  }
  function palmeira(x,base,alt,lado){
    cx.save();cx.fillStyle='#0b0414';cx.strokeStyle='#0b0414';
    cx.lineWidth=Math.max(6,alt*.035);cx.lineCap='round';
    const topoX=x+lado*alt*.18, topoY=base-alt;
    cx.beginPath();cx.moveTo(x,base);cx.quadraticCurveTo(x+lado*alt*.02,base-alt*.55,topoX,topoY);cx.stroke();
    const balanco=Math.sin(t/900+x)*.05;
    for(let i=0;i<7;i++){
      const a=-Math.PI/2+(i-3)*.5+balanco, comp=alt*(.42+(i%2)*.08);
      const fx=topoX+Math.cos(a)*comp, fy=topoY+Math.sin(a)*comp*.55+comp*.25;
      cx.beginPath();cx.moveTo(topoX,topoY);
      cx.quadraticCurveTo(topoX+Math.cos(a)*comp*.6,topoY+Math.sin(a)*comp*.6-comp*.12,fx,fy);
      cx.lineWidth=Math.max(5,alt*.03);cx.stroke();
    }
    cx.restore();
  }
  function desenha(){
    t+=16;
    const hz=H*.62;
    const g=cx.createLinearGradient(0,0,0,hz);
    g.addColorStop(0,'#140a24');g.addColorStop(.45,'#3b1257');g.addColorStop(.8,'#b02a6b');g.addColorStop(1,'#ff8a3c');
    cx.fillStyle=g;cx.fillRect(0,0,W,hz);
    estrelas.forEach(s=>{cx.globalAlpha=.4+.6*Math.abs(Math.sin(t/700+s.f));cx.fillStyle='#fff6ee';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()});
    cx.globalAlpha=1;
    // sol listrado
    const R=Math.min(W,H)*.26, sx=W/2, sy=hz;
    const gs=cx.createLinearGradient(0,sy-R,0,sy);gs.addColorStop(0,'#ffd34d');gs.addColorStop(1,'#ff3d8b');
    cx.save();cx.beginPath();cx.arc(sx,sy,R,Math.PI,0);cx.clip();
    cx.fillStyle=gs;cx.fillRect(sx-R,sy-R,R*2,R);
    cx.fillStyle='#b02a6b';
    for(let i=0;i<7;i++){const y=sy-R*.5+i*R*.085+((t/40)%(R*.085));const h=2+i*1.6;cx.fillRect(sx-R,y,R*2,h)}
    cx.restore();
    // chão com grade
    const gc=cx.createLinearGradient(0,hz,0,H);gc.addColorStop(0,'#2a0d3d');gc.addColorStop(1,'#0b0414');
    cx.fillStyle=gc;cx.fillRect(0,hz,W,H-hz);
    cx.strokeStyle='rgba(62,230,255,.55)';cx.lineWidth=1.5;
    for(let i=-20;i<=20;i++){cx.beginPath();cx.moveTo(W/2+i*W*.02,hz);cx.lineTo(W/2+i*W*.16,H);cx.stroke()}
    const off=(t/30)%40;
    for(let k=0;k<14;k++){const p=(k*40+off)/560;const y=hz+(H-hz)*p*p;cx.globalAlpha=Math.min(1,p*2);cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
    cx.globalAlpha=1;
    const alt=Math.min(H*.55,W*.5);
    palmeira(W*.08,hz+4,alt,1);palmeira(W*.2,hz+4,alt*.7,1);
    palmeira(W*.92,hz+4,alt,-1);palmeira(W*.8,hz+4,alt*.65,-1);
    if(!reduz) requestAnimationFrame(desenha);
  }
  /* ---------- confete ---------- */
  const conf=document.getElementById('confete'), kx=conf.getContext('2d');
  let pecas=[],soltando=false;
  const cores=['#ffd34d','#ff9a3c','#ff3d8b','#3ee6ff','#fff6ee'];
  function solta(n){for(let i=0;i<n;i++)pecas.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,c:cores[i%cores.length]})}
  function anima(){
    kx.clearRect(0,0,W,H);
    pecas.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;kx.save();kx.translate(p.x,p.y);kx.rotate(p.r);kx.fillStyle=p.c;kx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);kx.restore()});
    pecas=pecas.filter(p=>p.y<H+30);
    if(soltando&&pecas.length<260)solta(6);
    if(pecas.length||soltando)requestAnimationFrame(anima);
  }
  /* ---------- som (sintetizado, sem arquivo) ---------- */
  let ac=null;
  function nota(f,ini,dur,tipo,vol){
    if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();
    o.type=tipo||'square';o.frequency.value=f;g.gain.setValueAtTime(0,ac.currentTime+ini);
    g.gain.linearRampToValueAtTime(vol||.12,ac.currentTime+ini+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+ini+dur);
    o.connect(g).connect(ac.destination);o.start(ac.currentTime+ini);o.stop(ac.currentTime+ini+dur+.05);
  }
  const bip=a=>nota(a?880:440,0,.25,'square',.15);
  function fanfarra(){
    const m=[[523,0],[659,.15],[784,.3],[1047,.45],[784,.75],[1047,.9]];
    m.forEach(([f,i])=>{nota(f,i,.35,'sawtooth',.09);nota(f/2,i,.35,'triangle',.12)});
    [[131,1.2],[131,1.5],[175,1.8],[196,2.1]].forEach(([f,i])=>nota(f,i,.28,'square',.1));
  }
  /* ---------- roteiro ---------- */
  const cenas=[...document.querySelectorAll('.cena')], num=document.getElementById('num'), denovo=document.getElementById('denovo');
  const mostra=i=>cenas.forEach((c,k)=>c.classList.toggle('fora',k!==i));
  const espera=ms=>new Promise(r=>setTimeout(r,ms));
  let rodando=false;
  async function roteiro(){
    if(rodando)return;rodando=true;denovo.hidden=true;
    try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){ac=null}
    try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}
    try{await navigator.wakeLock?.request('screen')}catch(e){}
    mostra(1);nota(392,0,.5,'triangle',.12);nota(523,.25,.6,'triangle',.12);
    await espera(4200);
    mostra(2);
    for(const n of [3,2,1]){num.textContent=n;num.classList.remove('pulsa');void num.offsetWidth;num.classList.add('pulsa');bip(false);await espera(1000)}
    mostra(3);
    const gta=document.getElementById('gta');gta.classList.remove('entra');void gta.offsetWidth;gta.classList.add('entra');
    bip(true);fanfarra();
    if(!reduz){soltando=true;solta(140);anima();setTimeout(()=>soltando=false,9000)}
    await espera(4000);denovo.hidden=false;rodando=false;
  }
  document.getElementById('comecar').addEventListener('click',roteiro);
  denovo.addEventListener('click',roteiro);
  addEventListener('resize',()=>{tam();if(reduz)desenha()});
  tam();desenha();
})();
</script>
</body>
</html>
